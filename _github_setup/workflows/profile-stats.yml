name: ⚡ XP Engine

on:
  schedule:
    # every 6 hours — GitHub queues cron generously, exact minute will drift
    - cron: "17 */6 * * *"
  push:
    branches: [main, master]
    paths:
      - "README.md"
      - "README-game.md"
      - "scripts/update_stats.py"
      - ".github/workflows/profile-stats.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xp-engine
  cancel-in-progress: true

jobs:
  level-up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recalculate XP from real GitHub activity
        env:
          # default GITHUB_TOKEN works; swap for a PAT with read:user + repo
          # if you want private-contribution counts included
          GH_TOKEN: ${{ secrets.XP_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          README_FILES: "README.md,README-game.md"
        run: python scripts/update_stats.py

      - name: Commit if the numbers moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(xp): autosave — stats refreshed"
            git push
          else
            echo "no XP gained since last run"
          fi
